[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On

; Resource Limits
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Error handling & logging
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

; Data Handling & File Uploads (Disesuaikan untuk Unggah Foto Bukti QRIS & File Excel)
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 20

; Timezone & Locales
[Date]
date.timezone = Asia/Jakarta
