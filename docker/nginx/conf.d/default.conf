server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;
    charset utf-8;

    # Kapasitas unggah berkas (disesuaikan untuk foto QRIS & berkas Excel dataset)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Kompresi Gzip untuk performa jaringan cepat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan berkas statis (gambar, font, css, js, dan public storage)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir akses ke berkas tersembunyi (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proxy FastCGI ke kontainer PHP-FPM (layanan 'app')
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Teruskan status HTTPS dari reverse proxy (NPM) ke Laravel
        set $fastcgi_https off;
        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https on;
        }
        if ($https = "on") {
            set $fastcgi_https on;
        }
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Timeout & Buffer untuk kueri laporan / impor besar
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Logging
    error_log /var/log/nginx/kobana_error.log warn;
    access_log /var/log/nginx/kobana_access.log;
}
